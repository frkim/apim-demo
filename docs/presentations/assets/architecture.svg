<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Azure API Management AI Gateway reference architecture</title><desc id="desc">Apps and agents call Azure API Management AI Gateway, which applies policies, routes to current Microsoft Foundry resources and projects in Sweden Central and France Central, exposes MCP tools for Zava Retail APIs, and emits telemetry to Application Insights and Log Analytics.</desc>
<defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06162F"/><stop offset="1" stop-color="#0B1E3F"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B1E3F" flood-opacity="0.18"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="#F5F7FA"/><text x="42" y="54" fill="#0B1E3F" font-family="Segoe UI Semibold, Segoe UI, Arial" font-size="30" font-weight="700">Azure API Management as AI Gateway</text><text x="42" y="82" fill="#3B4A5E" font-family="Segoe UI, Arial" font-size="16">Keyless, governed model + MCP + agent traffic — demo environment in Sweden Central with Foundry resource/project pool</text>
<g filter="url(#shadow)"><rect x="36" y="130" width="226" height="112" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/><rect x="36" y="130" width="10" height="112" rx="5" fill="#00B7C3"/><text x="64" y="168" fill="#0B1E3F" font-family="Segoe UI Semibold, Segoe UI" font-size="20">Apps</text><text x="64" y="196" fill="#3B4A5E" font-family="Segoe UI" font-size="15">OpenAI SDK unchanged</text><text x="64" y="218" fill="#3B4A5E" font-family="Segoe UI" font-size="15">APIM subscription key</text><rect x="36" y="292" width="226" height="112" rx="16" fill="#FFFFFF" stroke="#D7DEE8"/><rect x="36" y="292" width="10" height="112" rx="5" fill="#00B7C3"/><text x="64" y="330" fill="#0B1E3F" font-family="Segoe UI Semibold, Segoe UI" font-size="20">Agents</text><text x="64" y="358" fill="#3B4A5E" font-family="Segoe UI" font-size="15">Model + tools through</text><text x="64" y="380" fill="#3B4A5E" font-family="Segoe UI" font-size="15">one governed path</text></g>
